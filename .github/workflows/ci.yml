name: Verify Room Rental System

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    name: Backend build and tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - run: dotnet restore RoomRental.BackEnd.Tests/RoomRental.BackEnd.Tests.csproj
      - run: dotnet build RoomRental.BackEnd.Tests/RoomRental.BackEnd.Tests.csproj --configuration Release --no-restore
      - run: dotnet test RoomRental.BackEnd.Tests/RoomRental.BackEnd.Tests.csproj --configuration Release --no-restore

  frontend:
    name: Frontend lint and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
